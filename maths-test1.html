<style>
:root{
  --dark:#1d1c19;
  --gold:#c99b43;
  --gold-dark:#a87925;
  --cream:#f2ede4;
  --offwhite:#faf7f1;
  --text:#292722;
  --muted:#6e685e;
  --border:#d7cdbc;
  --soft:#ebe2d4;
  --hero:#dbeaf5;
  --hero-border:#c5d8e5;
  --green:#3f8b62;
  --green-bg:#e4f1e8;
  --red:#b94d4d;
  --red-bg:#f7e5e2;
  --shadow:0 10px 28px rgba(45,39,30,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
}

header{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  border-bottom:1px solid #3d3a34;
  background:var(--dark);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  flex-shrink:0;
}

.logo-icon{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
  background:linear-gradient(135deg,#d6b36b,#8fa8bd);
  border-radius:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.20);
}

.logo-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.logo-text h1{
  margin:0;
  color:#f5efe5;
  font-size:29px;
  line-height:1;
  letter-spacing:.5px;
}

.logo-text p{
  margin:5px 0 0;
  color:#d3a84f;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  border:1px solid var(--gold);
  padding:9px 16px;
  border-radius:9px;
  font-weight:bold;
}

.back-btn:hover{
  background:var(--gold);
  color:var(--dark);
}

.test-header{
  text-align:center;
  padding:34px 15px;
  background:var(--hero);
  border-bottom:1px solid var(--hero-border);
}

.test-header h1{
  margin:0;
  color:var(--dark);
  font-size:28px;
}

.test-header p{
  color:#5f6b73;
  margin:8px 0 0;
}

/* WIDER DESKTOP LAYOUT */

.container{
  max-width:1150px;
  margin:auto;
  padding:22px 20px;
}

.card{
  background:var(--offwhite);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.card h2{
  margin-top:0;
  color:var(--dark);
}

/* STUDENT DETAILS */

.student-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.input-group{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.input-group label{
  color:var(--text);
  font-size:15px;
  font-weight:700;
}

input[type="text"],
input[type="tel"]{
  width:100%;
  padding:14px;
  background:#fffdf9;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:15px;
  outline:none;
}

input[type="text"]:focus,
input[type="tel"]:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,155,67,.14);
}

/* MOBILE STICKY PROGRESS */

.mobile-progress{
  display:none;
}

/* QUESTIONS */

.question-number{
  color:var(--gold-dark);
  font-weight:bold;
  margin-bottom:12px;
  font-size:13px;
  letter-spacing:.4px;
}

.question-text{
  white-space:pre-line;
  line-height:1.65;
  font-size:17px;
  font-weight:600;
  color:var(--text);
  margin-bottom:18px;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:#fffdf9;
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
  color:var(--text);
  line-height:1.5;
}

.option:hover{
  border-color:var(--gold);
  background:#fffaf0;
}

.option input{
  margin-top:3px;
  accent-color:var(--gold-dark);
  flex-shrink:0;
}

/* SUBMIT BUTTON */

.submit-area{
  text-align:center;
  padding:20px;
}

.submit-btn{
  border:none;
  background:var(--gold);
  color:#fffdf9;
  font-size:16px;
  font-weight:bold;
  padding:15px 38px;
  border-radius:10px;
  cursor:pointer;
}

.submit-btn:hover{
  background:var(--gold-dark);
}

/* RESULTS */

.result-summary{
  text-align:center;
  background:var(--offwhite);
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:var(--shadow);
}

.result-summary h2{
  color:var(--dark);
}

.score{
  color:var(--gold-dark);
  font-size:32px;
  font-weight:bold;
  margin:12px 0;
}

.correct{
  border-left:5px solid var(--green);
}

.wrong{
  border-left:5px solid var(--red);
}

.result-option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  background:#fffdf9;
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:16px;
  color:var(--text);
}

.result-option-text{
  flex:1;
}

.result-option.selected-correct,
.result-option.actual-correct{
  border-color:var(--green);
  background:var(--green-bg);
}

.result-option.selected-wrong{
  border-color:var(--red);
  background:var(--red-bg);
}

.answer-status{
  font-size:20px;
  font-weight:bold;
  min-width:25px;
  text-align:right;
}

.tick{
  color:var(--green);
}

.cross{
  color:var(--red);
}

.result-explanation{
  margin-top:18px;
  padding:16px;
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:10px;
  line-height:1.6;
  color:var(--text);
}

.result-explanation strong{
  color:var(--gold-dark);
}

/* DESKTOP QUESTION STATUS */

.test-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 210px;
  gap:20px;
  align-items:start;
}

.question-sidebar{
  position:sticky;
  top:15px;
  background:var(--offwhite);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

.question-sidebar h3{
  margin:0 0 12px;
  color:var(--dark);
  font-size:16px;
}

.question-legend{
  font-size:12px;
  color:var(--muted);
  line-height:1.8;
  margin-bottom:12px;
}

.legend-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:5px;
}

.legend-answered{
  background:var(--green);
}

.legend-unanswered{
  background:#b7aa97;
}

.question-nav-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.question-nav-btn{
  width:100%;
  aspect-ratio:1;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fffdf9;
  color:var(--text);
  font-weight:bold;
  cursor:pointer;
}

.question-nav-btn:hover{
  border-color:var(--gold);
  background:#fff8e9;
}

.question-nav-btn.answered{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.question-nav-btn.unanswered{
  background:#fffdf9;
}

/* MOBILE */

@media(max-width:600px){

  header{
    padding:0 16px;
    min-height:64px;
  }


  .back-btn{
    padding:8px 10px;
    font-size:13px;
  }

  .test-header h1{
    font-size:22px;
  }

  .container{
    padding:18px 14px;
  }

  .student-grid{
    grid-template-columns:1fr;
  }

  .test-layout{
    grid-template-columns:1fr;
  }

  /* HIDE DESKTOP QUESTION STATUS ON MOBILE */

  .question-sidebar{
    display:none;
  }

  /* SHOW STICKY MOBILE PROGRESS */

  .mobile-progress{
    display:block;
    position:sticky;
    top:8px;
    z-index:100;
    background:var(--dark);
    color:#f5efe5;
    border:1px solid var(--gold);
    border-radius:10px;
    padding:12px 15px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
  }

  .mobile-progress span{
    color:var(--gold);
  }

  .card{
    padding:18px;
    border-radius:14px;
  }

  .question-text{
    font-size:16px;
  }

  .submit-btn{
    width:100%;
  }

}


/* ================= FINAL MOBILE HEADER ================= */
@media(max-width:600px){
  /* Hide logo on mobile to save vertical space */
  header .logo{
    display:none !important;
  }

  header{
    min-height:58px !important;
    justify-content:flex-end !important;
    padding:0 16px !important;
  }

  .back-btn{
    margin-left:auto;
    padding:8px 12px !important;
    font-size:13px !important;
  }
}

</style>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL

   AFTER DEPLOYING THE APPS SCRIPT,

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyHGyRFo8DMY_GiOJum_3zr1AuBfq2EgseDCx56gcIlU1UFfUF9JmTjQnt4V21hB0EG/exec";


/* =========================================================
   TEST INFORMATION
   ========================================================= */

const TEST_NAME = "Class 9 Maths – Free Test 1";


/* =========================================================
   QUESTIONS
   ========================================================= */

const questions = [

  {
    "itemNumber": 1,
    "title":
    "1. Assertion: Transport is necessary for economic development.\nReason: Goods do not move on their own.",

    "helpText": "",

  },


  {

    "2. Assertion: India has one of the largest road networks in the world.\nReason: Roads connect even remote villages.",

    "helpText": "",
    "type": "MULTIPLE_CHOICE",
    "required": true,

    "options": [
      "Both A and R are true and R explains A",
      "Both A and R are true but R does not explain A",
      "A is true but R is false",
      "Both A and R are false"
    ],

    "correctAnswers": [
      "Both A and R are true and R explains A"
    ],

    "points": 1,

    "correctFeedback":
    "✔ Correct\nConcept: Extensive connectivity increases road length.",

    "incorrectFeedback":
    "❌ Review Concept\nExplanation: Extensive connectivity increases road length."
  },


  {
    "itemNumber": 3,
    "title":
    "3. Assertion: Golden Quadrilateral connects major metros.\nReason: It improves industrial and trade connectivity.",

    "helpText": "",
    "type": "MULTIPLE_CHOICE",
    "required": true,

    "options": [
      "Both A and R are true and R explains A",
      "Both A and R are true but R does not explain A",
      "A is true but R is false",
      "Both A and R are false"
    ],

    "correctAnswers": [
      "Both A and R are true and R explains A"
    ],

    "points": 1,

    "correctFeedback":
    "✔ Correct\nConcept: It boosts economic integration.",

    "incorrectFeedback":
    "❌ Review Concept\nExplanation: It boosts economic integration."
  }

];


/* =========================================================
   DISPLAY QUESTIONS
   ========================================================= */

function renderQuestions(){

  const container =
    document.getElementById("questionsContainer");

  const questionNav =
    document.getElementById("questionNav");

  const totalCount =
    document.getElementById("mobileTotalCount");


  container.innerHTML = "";
  questionNav.innerHTML = "";

  totalCount.textContent =
    questions.length;


  questions.forEach((question,index)=>{

    let optionsHTML = "";


    question.options.forEach((option)=>{

      optionsHTML += `

        <label class="option">

          <input
            type="radio"
            name="question_${index}"
            value="${escapeHTML(option)}"
            onchange="updateQuestionStatus(${index})"
          >

          ${escapeHTML(option)}

        </label>

      `;

    });


    container.innerHTML += `

      <div
        class="card"
        id="questionCard_${index}">

        <div class="question-number">

          QUESTION ${index + 1}

        </div>


        <div class="question-text">

          ${escapeHTML(question.title)}

        </div>


        ${optionsHTML}

      </div>

    `;


    questionNav.innerHTML += `

      <button
        type="button"
        class="question-nav-btn unanswered"
        id="navQuestion_${index}"
        onclick="goToQuestion(${index})"
        title="Question ${index + 1}">

        ${index + 1}

      </button>

    `;

  });


  updateMobileProgress();

}


/* =========================================================
   UPDATE QUESTION STATUS
   ========================================================= */

function updateQuestionStatus(index){

  const selected =
    document.querySelector(
      `input[name="question_${index}"]:checked`
    );


  const navButton =
    document.getElementById(
      `navQuestion_${index}`
    );


  if(navButton){

    if(selected){

      navButton.classList.remove("unanswered");
      navButton.classList.add("answered");

    }else{

      navButton.classList.remove("answered");
      navButton.classList.add("unanswered");

    }

  }


  updateMobileProgress();

}


/* =========================================================
   UPDATE MOBILE PROGRESS
   ========================================================= */

function updateMobileProgress(){

  let answeredCount = 0;


  questions.forEach((question,index)=>{

    const selected =
      document.querySelector(
        `input[name="question_${index}"]:checked`
      );


    if(selected){

      answeredCount++;

    }

  });


  document
    .getElementById("mobileAnsweredCount")
    .textContent = answeredCount;

}


/* =========================================================
   GO TO QUESTION
   ========================================================= */

function goToQuestion(index){

  const card =
    document.getElementById(
      `questionCard_${index}`
    );


  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}


/* =========================================================
   SAVE TEST RESPONSE TO GOOGLE SHEETS
   ========================================================= */

function saveResponseToGoogleSheet(data){

  if(
    !GOOGLE_SCRIPT_URL ||
    GOOGLE_SCRIPT_URL.includes(
      "PASTE_YOUR_GOOGLE"
    )
  ){

    console.warn(
      "Google Apps Script URL has not been added."
    );

    return;

  }


  const formData =
    new URLSearchParams();


  formData.append(
    "data",
    JSON.stringify(data)
  );


  /*
    no-cors allows the website to send
    the submission to the Apps Script
    Web App from another domain.
  */

  fetch(
    GOOGLE_SCRIPT_URL,
    {
      method:"POST",
      mode:"no-cors",
      body:formData
    }
  )

  .catch(error=>{

    console.error(
      "Google Sheet save error:",
      error
    );

  });

}


/* =========================================================
   SUBMIT TEST
   ========================================================= */

function submitTest(){

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const studentPhone =
    document
      .getElementById("studentPhone")
      .value
      .trim();


  /* VALIDATE STUDENT NAME */

  if(!studentName){

    alert(
      "Please enter Student Name."
    );

    document
      .getElementById("studentName")
      .focus();

    return;

  }


  /* VALIDATE PHONE NUMBER */

  if(!studentPhone){

    alert(
      "Please enter Phone Number."
    );

    document
      .getElementById("studentPhone")
      .focus();

    return;

  }


  /* CHECK UNANSWERED QUESTIONS */

  let unanswered = [];


  questions.forEach((question,index)=>{

    const selected =
      document.querySelector(
        `input[name="question_${index}"]:checked`
      );


    if(!selected){

      unanswered.push(index + 1);

    }

  });


  if(unanswered.length > 0){

    alert(
      "Please answer all questions.\n\nUnanswered questions: "
      +
      unanswered.join(", ")
    );


    goToQuestion(
      unanswered[0] - 1
    );


    return;

  }


  /* PREVENT DOUBLE CLICK */

  const submitButton =
    document.getElementById(
      "submitButton"
    );


  submitButton.disabled = true;

  submitButton.textContent =
    "SUBMITTING...";


  /* CALCULATE SCORE */

  let score = 0;

  let reviewHTML = [];

  let studentAnswers = [];


  questions.forEach((question,index)=>{

    const selected =
      document.querySelector(
        `input[name="question_${index}"]:checked`
      );


    const studentAnswer =
      selected.value;


    const correctAnswers =
      Array.isArray(
        question.correctAnswers
      )
      ?
      question.correctAnswers
      :
      [];


    const isCorrect =
      correctAnswers.includes(
        studentAnswer
      );


    if(isCorrect){

      score++;

    }


    /* SAVE ANSWER DATA */

    studentAnswers.push({

      questionNumber:index + 1,

      question:question.title,

      selectedAnswer:studentAnswer,

      correctAnswer:
        correctAnswers.join(" | "),

      isCorrect:isCorrect

    });


    /* RESULT OPTIONS */

    let resultOptionsHTML = "";


    question.options.forEach((option)=>{

      const isSelected =
        option === studentAnswer;


      const isActualCorrect =
        correctAnswers.includes(option);


      let optionClass = "";

      let statusMark = "";


      if(
        isSelected &&
        isActualCorrect
      ){

        optionClass =
          "selected-correct";


        statusMark =
          `<span class="answer-status tick">✓</span>`;

      }


      else if(
        isSelected &&
        !isActualCorrect
      ){

        optionClass =
          "selected-wrong";


        statusMark =
          `<span class="answer-status cross">✗</span>`;

      }


      else if(
        !isSelected &&
        isActualCorrect
      ){

        optionClass =
          "actual-correct";


        statusMark =
          `<span class="answer-status tick">✓</span>`;

      }


      resultOptionsHTML += `

        <div
          class="result-option ${optionClass}">

          <span
            class="result-option-text">

            ${escapeHTML(option)}

          </span>

          ${statusMark}

        </div>

      `;

    });


    const explanationText =
      isCorrect
      ?
      (
        question.correctFeedback
        ||
        ""
      )
      :
      (
        question.incorrectFeedback
        ||
        ""
      );


    reviewHTML.push(`

      <div
        class="card
        ${isCorrect ? "correct" : "wrong"}">

        <div class="question-number">

          QUESTION ${index + 1}

          ${

            isCorrect

            ?

            "✓ CORRECT"

            :

            "✗ WRONG"

          }

        </div>


        <div class="question-text">

          ${escapeHTML(question.title)}

        </div>


        <div class="result-options">

          ${resultOptionsHTML}

        </div>


        <div class="result-explanation">

          <strong>
            Explanation:
          </strong>

          <br><br>

          ${escapeHTML(explanationText)}

        </div>

      </div>

    `);

  });


  /* CALCULATE PERCENTAGE */

  const percentage =
    (
      score /
      questions.length *
      100
    )
    .toFixed(2);


  /* CREATE DATA FOR GOOGLE SHEETS */

  const submissionData = {

    testName:TEST_NAME,

    studentName:studentName,

    studentPhone:studentPhone,

    score:score,

    totalQuestions:
      questions.length,

    percentage:percentage,

    answers:studentAnswers

  };


  /* SEND DATA TO GOOGLE SHEETS */

  saveResponseToGoogleSheet(
    submissionData
  );


  /* SHOW RESULT */

  document
    .getElementById("testContainer")
    .style.display = "none";


  const resultContainer =
    document.getElementById(
      "resultContainer"
    );


  resultContainer.style.display =
    "block";


  resultContainer.innerHTML = `

    <div class="result-summary">

      <h2>
        TEST RESULT
      </h2>


      <p>

        <strong>Student:</strong>

        ${escapeHTML(studentName)}

      </p>


      <p>

        <strong>Phone:</strong>

        ${escapeHTML(studentPhone)}

      </p>


      <div class="score">

        ${score}
        /
        ${questions.length}

      </div>


      <p>

        Percentage:
        <strong>
          ${percentage}%
        </strong>

      </p>


      <p>

        Review each question below.
        Your selected answer is marked,
        and the correct answer is shown
        with a tick where needed.

      </p>

    </div>


    ${reviewHTML.join("")}

  `;


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* START TEST */

renderQuestions();

</script>
